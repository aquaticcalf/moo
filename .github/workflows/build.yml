name: build moo binaries

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'which build(s) to produce'
        type: choice
        required: true
        default: both
        options:
          - linux
          - windows
          - both

permissions:
  contents: read
  packages: read

env:
  GHCR_IMAGE: ghcr.io/aquaticcalf/moo:latest

jobs:
  # ---------- linux ----------
  linux:
    name: linux build (dev container)
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'linux' || github.event.inputs.target == 'both'

    steps:
      - uses: actions/checkout@v6

      - name: log in to ghcr (dev image is private)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build linux binary
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ env.GHCR_IMAGE }} \
            make linux

      - name: upload linux binary
        uses: actions/upload-artifact@v4
        with:
          name: moo-linux
          path: build/linux/moo
          if-no-files-found: error

  # ---------- windows, part 1: cross compile the .obj in the dev container ----------
  windows-obj:
    name: windows part 1 (obj via dev container)
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'windows' || github.event.inputs.target == 'both'

    steps:
      - uses: actions/checkout@v6

      - name: log in to ghcr (dev image is private)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # same command as `make windows` but without the clear/echo bits
      - name: compile windows object
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ env.GHCR_IMAGE }} \
            sh -c "mkdir -p build/windows && cd compiler && odin build . --collection:compiler=. -o:speed -out:../build/windows/moo -target:windows_amd64 -build-mode:obj"

      - name: upload windows object
        uses: actions/upload-artifact@v4
        with:
          name: moo-windows-obj
          path: build/windows/moo.obj
          if-no-files-found: error

  # ---------- windows, part 2: link on a real windows box with msvc ----------
  # mingw-w64 in the container doesn't carry the MSVC/ucrt import libs
  # so this has to happen on an actual windows runner
  windows-link:
    name: windows part 2 (link.exe -> moo.exe)
    runs-on: windows-latest
    needs: windows-obj
    if: github.event.inputs.target == 'windows' || github.event.inputs.target == 'both'

    steps:
      - uses: actions/checkout@v6

      - name: download windows object
        uses: actions/download-artifact@v4
        with:
          name: moo-windows-obj
          path: build/windows

      # puts cl.exe / link.exe / the MSVC + Windows SDK LIB paths on PATH
      - name: set up msvc dev environment
        uses: ilammy/msvc-dev-cmd@v1

      # provide llvm headers and import libraries for the in-process shim
      - name: set up llvm
        shell: pwsh
        run: |
          $source = "$env:RUNNER_TEMP\llvm-project-20.1.8.src.tar.xz"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/llvm-project-20.1.8.src.tar.xz" -OutFile $source
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\llvm-source" | Out-Null
          tar -xf $source --strip-components=1 -C "$env:RUNNER_TEMP\llvm-source"
          cmake -S "$env:RUNNER_TEMP\llvm-source\llvm" -B "$env:RUNNER_TEMP\llvm-build" -G "Visual Studio 18 2026" -A x64 -DLLVM_ENABLE_PROJECTS=lld -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_TARGETS_TO_BUILD=X86 -DLLVM_BUILD_TOOLS=ON -DCMAKE_INSTALL_PREFIX=C:\LLVM
          cmake --build "$env:RUNNER_TEMP\llvm-build" --config Release --target lldCOFF lldCommon LLVM-C
          cmake --install "$env:RUNNER_TEMP\llvm-build" --config Release
          $llvm = 'C:\LLVM'
          if (-not (Test-Path "$llvm\include\llvm-c\Analysis.h")) { throw 'LLVM development headers were not installed' }
          "$llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8
          "LLVM_ROOT=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: compile llvm shim
        shell: pwsh
        run: |
          $llvm = $env:LLVM_ROOT
          cl.exe /nologo /c /I"$llvm\include" compiler\toolchain\llvm\shim.c /Fo:build\windows\llvmshim.obj
          cl.exe /nologo /EHsc /std:c++20 /c /I"$llvm\include" compiler\toolchain\lld\shim.cpp /Fo:build\windows\lldshim.obj
          lib.exe /nologo build\windows\llvmshim.obj /out:build\windows\libmoo_llvmshim.lib
          lib.exe /nologo build\windows\lldshim.obj /out:build\windows\libmoo_lldshim.lib

      # link the compiler object, shim, and llvm c api on a native windows runner
      - name: link moo.exe
        shell: pwsh
        run: |
          $llvm = $env:LLVM_ROOT
          $llvm_libs = & "$llvm\bin\llvm-config.exe" --link-static --libfiles lldCOFF lldCommon LLVM-C
          link.exe build\windows\moo.obj build\windows\libmoo_llvmshim.lib build\windows\libmoo_lldshim.lib $llvm_libs /out:build\windows\moo.exe /subsystem:console /nodefaultlib:libcmt.lib /nodefaultlib:libucrt.lib msvcrt.lib ucrt.lib ole32.lib bcrypt.lib ntdll.lib kernel32.lib shell32.lib advapi32.lib

      - name: upload windows exe
        uses: actions/upload-artifact@v4
        with:
          name: moo-windows
          path: build/windows/moo.exe
          if-no-files-found: error
